name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Setup Android Project & Build
        run: |
          cd flutter_app
          flutter create --platforms=android --org com.anonsuperapp .
          flutter pub get
          # Fix Kotlin version for webview_flutter compatibility
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.24'/" android/build.gradle
          sed -i "s/implementation "org.jetbrains.kotlin.android" /implementation "org.jetbrains.kotlin.android" '1.9.24'/" android/settings.gradle
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: anon-superapp-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
