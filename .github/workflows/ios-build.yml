name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      # 3. Ensure iOS directory exists and is properly configured
      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          flutter create --platforms=ios --org com.anonsuperapp .
          flutter pub get

      # 4. Install CocoaPods
      - name: Install CocoaPods
        run: |
          cd flutter_app/ios
          pod install

      # 5. Build IPA
      - name: Build IPA
        run: |
          cd flutter_app
          flutter build ios --release --no-codesign
          APP_DIR=$(find build/ios/iphoneos -name '*.app' -type d | head -1)
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -r -y anon-superapp.ipa Payload
          rm -rf Payload
          ls -la anon-superapp.ipa

      # 6. Upload artifact
      - uses: actions/upload-artifact@v4
        with:
          name: anon-superapp-ipa
          path: flutter_app/anon-superapp.ipa
          retention-days: 1
