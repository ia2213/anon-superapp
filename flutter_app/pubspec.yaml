name: anon_superapp
description: "Anonymous Super-App: Privacy-first messaging, wallet, file transfer, and search"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # HTTP & API
  http: ^1.2.2
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Local Storage
  shared_preferences: ^2.3.2
  
  # UI Components
  google_fonts: ^6.2.1
  
  # Crypto & QR
  qr_flutter: ^4.1.0
  
  # File Handling
  file_picker: ^8.1.2
  
  # URL Launcher
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
