name: anon_superapp
description: "Anonymous Super-App: Privacy-first messaging, wallet, file transfer, and search"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Local Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  
  # UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  
  # Crypto & QR
  crypto: ^3.0.5
  qr_flutter: ^4.1.0
  
  # File Handling
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  open_file: ^3.5.5
  
  # WebSocket for real-time messaging
  web_socket_channel: ^3.0.1
  
  # Tor integration
  tor_socks: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
